name: Compila Tachimetro, nuova app

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # La chiave di firma sta solo nei segreti di GitHub
      - name: Controlla i segreti e prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Segreti mancanti:$missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/tachimetro.keystore" || { echo "::error::KEYSTORE_BASE64 non valido"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/tachimetro.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Password o alias della chiave di firma non corretti"; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/tachimetro.keystore" >> "$GITHUB_ENV"

      # Prima le prove automatiche delle regole: se una fallisce, niente APK
      - name: Prove automatiche del modulo Base
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Compila l'APK firmato
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verifica la firma dell'APK
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA1=$("$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}')
          echo "Impronta SHA-1: $SHA1"
          if [ "$SHA1" != "75e505093b47a8098ee1b09ae6e6b484801925db" ]; then echo "::error::La firma dell'APK è cambiata"; exit 1; fi

      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk "Tachimetro-nuova-${{ github.run_number }}.apk"

      - name: Crea la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nuova-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Tachimetro nuova app, modulo Base, build ${{ github.run_number }}
          make_latest: false
          prerelease: true
          body: |
            Nuova app Tachimetro, riscritta da zero. Modulo Base, modalità guidatore.
            Prima di installarla disinstalla la vecchia Tachimetro, perché hanno lo stesso nome.
            Apri `Tachimetro-nuova-${{ github.run_number }}.apk` dal telefono e consenti l'installazione da questa fonte.
          files: Tachimetro-nuova-*.apk
